<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple full-match badminton video deck focused on the newest relevant tournaments."
    />
    <title>Badminton Match Deck</title>
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Badminton full-match video player">
      <section class="stage" aria-live="polite">
        <div class="video-shell" id="gestureZone">
          <iframe
            id="videoFrame"
            title="Badminton full match"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
          <div class="swipe-strip left" aria-hidden="true"></div>
          <div class="swipe-strip right" aria-hidden="true"></div>
        </div>

        <div class="match-bar">
          <p class="kicker" id="tournamentText"></p>
          <h1 id="matchTitle"></h1>
        </div>
      </section>

      <nav class="controls" aria-label="Video controls">
        <button class="control-button" type="button" id="prevButton" aria-label="Previous full match">
          <span aria-hidden="true">&lsaquo;</span>
        </button>
        <span class="counter" id="counterText" aria-hidden="true"></span>
        <button class="control-button primary" type="button" id="nextButton" aria-label="Next full match">
          <span aria-hidden="true">&rsaquo;</span>
        </button>
      </nav>
    </main>

    <script src="./videos.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
